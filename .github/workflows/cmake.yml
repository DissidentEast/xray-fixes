name: CMake build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (VS2022, Win32)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build (Release)
        run: cmake --build build --config Release
      - name: Upload game binaries
        uses: actions/upload-artifact@v4
        with:
          name: xray-fixes-bin-release
          path: build/bin/Release

  build-windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (VS2022, x64)
        run: cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64
      - name: Build (Release)
        run: cmake --build build-x64 --config Release
      - name: Upload game binaries
        uses: actions/upload-artifact@v4
        with:
          name: xray-fixes-bin-release-x64
          path: build-x64/bin/Release
